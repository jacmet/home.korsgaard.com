# ============================================================
# HiFi-ESP32-S3 - Snapclient Configuration
# ============================================================
# ESP32 audio board with PCM5100 DAC, I2S output
# Configured as a Snapcast client for synchronized audio
# There are two implementations available:
# 1) Basic snapclient without DSP controls (c-MM original port)
# 2) snapclient with added DSP controls (farmed-switch fork of c-MM port)
#     Frequencies: 40, 50, 60, 70, 80, 90, 100, 110, 120, 130,
#                 140, 200, 315, 500, 800, 1250, 2000, 5000 Hz
#     Range: -15dB to +15dB per band
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: snapcast-livingroom
  friendly_name: Livingroom
  task_stack_in_psram: "true"

  # ===== Board-Specific Pinouts =====
  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # RGB LED
  rgb_led_pin: GPIO09

  # SPI pins (for display)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13

  # IR Receiver
  ir_rx_pin: GPIO07

  # Display control pins
  display_cs_pin: GPIO39
  display_dc_pin: GPIO40
  display_reset_pin: GPIO38

  # Ethernet pins (if using ethernet instead of wifi)
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

  # ===== Snapcast Server Configuration =====
  snapcast_server_ip: "192.168.1.100"
  snapcast_server_port: "1704"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.4
  name_add_mac_suffix: false

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: INFO

mqtt:
  broker: !secret mqtt_broker

web_server:
  port: 80

ota:
  platform: esphome

wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

output:
  - platform: gpio
    pin: ${eth_reset_pin}
    id: eth_reset

switch:
  - platform: template
    name: Amplifier
    id: amplifier
    optimistic: True
    turn_on_action:
      - output.turn_off: eth_reset
      - delay: 100ms
      - output.turn_on: eth_reset

external_components:
  - source: github://pr#14389
    components: [ snapclient ]
    refresh: 24h

i2s_audio:
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}

media_player:
  - platform: snapclient
    hostname: ${snapcast_server_ip}
    port: ${snapcast_server_port}
    name: ${friendly_name}
    id: snapclient_media_player
    i2s_dout_pin: ${i2s_dout_pin}

    on_play:
      - logger.log: "Playback started!"
      - switch.turn_on: amplifier

    on_pause:
      - logger.log: "Playback paused!"

    on_idle:
      - logger.log: "Playback finished!!!"

remote_receiver:
  id: ir_rx
  pin:
    number: ${ir_rx_pin}
    inverted: true
    mode:
      input: true
  # dump: all

# Infrared platform — creates infrared entities
infrared:
  - platform: ir_rf_proxy
    name: IR Receiver
    # receiver_frequency: 38kHz
    remote_receiver_id: ir_rx


debug:
  update_interval: 10s

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s

  - platform: internal_temperature
    name: "${friendly_name} CPU Temperature"
    update_interval: 60s

  - platform: debug
    # free:
    #   name: "Heap Free"
    # block:
    #   name: "Heap Max Block"
    # min_free:
    #   name: "Heap Min Free"
    # fragmentation:
    #   name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"
    cpu_frequency:
      name: "CPU Frequency"

  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: debug
    # device:
    #   name: "Device Info"
    reset_reason:
      name: "Reset Reason"

  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    mac_address:
      name: "${friendly_name} MAC"

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

button:
  - platform: restart
    id: restart_btn
    name: "${friendly_name} REBOOT"
